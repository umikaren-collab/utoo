<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U too｜香川のうどん・スイーツ</title>
<meta name="description" content="香川のうどん店とスイーツのお店を、営業時間・場所・気分から探せる個人制作アプリ。">
<style>
:root{--bg:#fbf8f2;--ink:#3b3227;--sub:#7a6d5e;--udon:#4f6b55;--udon-bg:#eef6ef;--sweets:#8a3a52;--sweets-bg:#fbf0f3;--line:#ebe3d6;--ikki:#b5410c;--ikki-bg:#fdf1e7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.7}
main{max-width:520px;margin:0 auto;padding:48px 16px 40px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:44px;margin:0;letter-spacing:.02em}
.lead{margin:6px 0 32px;color:var(--sub);font-size:15px}
.app{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;text-decoration:none;margin-bottom:16px;border:1px solid var(--line);transition:transform .15s}
.app:active{transform:scale(.98)}
.app .icon{font-size:40px;line-height:1}
.app b{display:block;font-size:20px}
.app span{font-size:13px;color:var(--sub)}
.udon{background:var(--udon-bg);color:var(--udon)}
.sweets{background:var(--sweets-bg);color:var(--sweets)}
.ikki{background:var(--ikki-bg);color:var(--ikki)}
.note{margin-top:28px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <h1>U too</h1>
  <p class="lead">香川の「いま行ける」お店を、営業時間・場所・気分から。</p>

  <a class="app udon" href="utoo.html">
    <div class="icon">🍜</div>
    <div><b>U too</b><span>香川のうどん店をさがす</span></div>
  </a>

  <a class="app sweets" href="utoo-sweets.html">
    <div class="icon">🍰</div>
    <div><b>U too Sweets</b><span>香川のスイーツのお店をさがす</span></div>
  </a>

  <a class="app ikki" href="ikki-too.html">
    <div class="icon">⚡</div>
    <div><b>Ikki too</b><span>番外編｜栄養ドリンクをさがす</span></div>
  </a>

  <p class="note">個人制作のアプリです。営業時間や定休日は変わることがあります。お出かけ前に各店の最新情報をご確認ください。<br>入力した内容やお気に入りはお使いのブラウザの中だけに保存され、どこにも送信されません。</p>
</main>
</body>
</html>
