<html lang="ja">
<head>

<meta name="theme-color" content="#1d1a14">
<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);

.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:24px;letter-spacing:.5px;font-weight:800}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--sub);font-size:11px}
.tabs{display:flex;gap:4px;margin-top:8px}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font-size:14px;font-weight:700;
  padding:10px 0;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
main{padding:14px 16px 120px;max-width:720px;margin:0 auto}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.q h2{margin:0 0 8px;font-size:14px;color:var(--sub);font-weight:700}
.q h2 b{color:var(--ink);font-size:16px;margin-right:6px}
.lvrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lvbtn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;
  padding:8px 2px 6px;text-align:center;cursor:pointer;font-size:11px;line-height:1.25}
.lvbtn .n{display:block;font-size:17px;font-weight:800}
.lvbtn.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.lvdesc{margin-top:8px;font-size:13px;color:var(--sub);min-height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;

.chip.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn)}
.bar{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;gap:8px}
.bar .cnt{font-weight:800}
.bar select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 8px;font-size:13px}
.reset{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:4px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:10px;cursor:pointer;align-items:center}
.thumb{width:72px;height:88px;flex:none;border-radius:12px;background:var(--chip);display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:64px;height:84px}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:15px;line-height:1.3}
.mk{font-size:12px;color:var(--sub)}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
.badge{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--ink);white-space:nowrap}
.b-sei{background:#e7f5ff;color:#1864ab}.b-bugai{background:#ebfbee;color:#2b8a3e}
.b-d3{background:#fff9db;color:#946200}.b-d2{background:#fff4e6;color:#d9480f}.b-d1{background:#ffe3e3;color:#c92a2a}
.b-caf0{background:#e6fcf5;color:#087f5b}.b-sake{background:#f3f0ff;color:#5f3dc4}
@media (prefers-color-scheme: dark){
  .b-sei{background:#1c3046;color:#a5d8ff}.b-bugai{background:#1d3324;color:#b2f2bb}
  .b-d3{background:#3a3214;color:#ffe066}.b-d2{background:#3d2614;color:#ffc078}.b-d1{background:#421d1d;color:#ffa8a8}
  .b-caf0{background:#14352d;color:#96f2d7}.b-sake{background:#2a2343;color:#d0bfff}

.price{font-weight:800;font-size:15px;margin-left:auto;white-space:nowrap}
.price small{font-weight:400;color:var(--sub);font-size:11px}
.lv{color:var(--accent);letter-spacing:-1px;font-size:12px}
.fav{border:0;background:none;font-size:20px;cursor:pointer;color:var(--sub);padding:2px 4px;flex:none;align-self:flex-start}
.fav.on{color:var(--accent2)}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.note{font-size:12px;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:18px}

.zone b{white-space:nowrap}
.zone small{color:var(--sub);font-weight:400;font-size:12px}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;

.hero{display:flex;gap:14px;align-items:center;margin:4px 0 12px}
.hero .thumb{width:110px;height:136px}
.hero .thumb svg{width:96px;height:128px}
.hero h3{margin:0;font-size:19px;line-height:1.3}
.kv{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{display:flex;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.kv div:first-child{border-top:0}
.kv dt{width:88px;flex:none;color:var(--sub);font-size:13px}
.kv dd{margin:0;flex:1}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font-size:13px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}

.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>Ikki <span>too</span></h1><small>栄養ドリンク図鑑 ・ by U too</small></div>
  <nav class="tabs">
    <button data-tab="find" class="on">さがす</button>
    <button data-tab="all">一覧</button>
    <button data-tab="fav">お気に入り</button>
  </nav>
</header>

<main>
  <section id="finder">
    <div class="q">
      <h2><b>①</b>今の疲れは？</h2>
      <div class="lvrow" id="lvrow"></div>
      <div class="lvdesc" id="lvdesc">レベルを選ぶと候補がしぼれます</div>
    </div>
    <div class="q">
      <h2><b>②</b>いつ飲む？</h2>
      <div class="chips" id="whenChips"></div>
    </div>
    <div class="q">
      <h2><b>③</b>用途は？</h2>
      <div class="chips" id="useChips"></div>
    </div>
    <div class="q" id="moreBox">
      <h2>こだわり（任意）</h2>
      <div class="chips" id="herbChips"></div>
      <div class="chips" id="placeChips" style="margin-top:8px"></div>
      <div class="chips" id="bandChips" style="margin-top:8px"></div>
    </div>
  </section>

  <div class="bar">
    <span class="cnt" id="cnt"></span>
    <span>
      <button class="reset" id="resetBtn">条件クリア</button>
      <select id="sort">
        <option value="lv">強さ順</option>
        <option value="pa">安い順</option>
        <option value="pd">高い順</option>
        <option value="nm">名前順</option>
      </select>
    </span>
  </div>
  <div class="list" id="list"></div>

  <div class="note">
    ・強さLvは、区分・生薬の数・価格からこのアプリが付けた<b>目安</b>で、効き目を保証するものではありません。<br>
    ・用法・用量を守り、ドリンク剤は原則1日1本。カフェイン入りの重ね飲みに注意。<br>
    ・15歳未満は飲めない商品が多いです。持病・服薬中・妊娠中は薬剤師か登録販売者に相談を。<br>
    ・価格は2026年10月時点で調べた通販・店頭の参考価格（税込）。「要確認」は推測で埋めていません。
  </div>
</main>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<input type="file" accept="image/*" id="photoInput" class="hide">

/* ===== 状態 ===== */
const S = {tab:"find", lv:null, when:new Set(), use:new Set(), herb:new Set(), place:new Set(), band:new Set(), sort:"lv"};
const LS = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let favs = new Set(LS.get("ikki_fav",[]));
let photos = LS.get("ikki_photos",{});

/* ===== ボトルのイラスト ===== */
function bottle(d){
  const c=d.c||"#888", lab="#fff";
  const short=(d.n.replace(/（.*?）/g,"").slice(0,4));
  if(d.f==="tab") return `<svg viewBox="0 0 64 84"><rect x="8" y="14" width="48" height="58" rx="5" fill="${c}"/><rect x="8" y="14" width="48" height="14" rx="5" fill="rgba(255,255,255,.25)"/><circle cx="24" cy="48" r="6" fill="${lab}"/><circle cx="40" cy="48" r="6" fill="${lab}" opacity=".8"/><circle cx="32" cy="60" r="6" fill="${lab}" opacity=".6"/></svg>`;
  if(d.f==="neri") return `<svg viewBox="0 0 64 84"><rect x="12" y="26" width="40" height="46" rx="8" fill="${c}"/><rect x="10" y="18" width="44" height="12" rx="4" fill="#3a2a18"/><rect x="18" y="40" width="28" height="18" rx="3" fill="${lab}" opacity=".9"/><text x="32" y="53" font-size="9" text-anchor="middle" fill="${c}" font-weight="700">煉</text></svg>`;
  if(d.f==="sake") return `<svg viewBox="0 0 64 84"><rect x="26" y="4" width="12" height="16" rx="2" fill="#2b1a10"/><path d="M26 20 Q14 30 14 42 V76 Q14 80 18 80 H46 Q50 80 50 76 V42 Q50 30 38 20Z" fill="${c}"/><rect x="18" y="44" width="28" height="24" rx="3" fill="#f5e6c8"/><text x="32" y="60" font-size="10" text-anchor="middle" fill="${c}" font-weight="800">薬酒</text></svg>`;
  if(d.f==="oro") return `<svg viewBox="0 0 64 84"><rect x="25" y="6" width="14" height="8" rx="2" fill="#d9d9d9"/><path d="M25 14 H39 V24 Q48 30 48 40 V76 Q48 80 44 80 H20 Q16 80 16 76 V40 Q16 30 25 24Z" fill="${c}"/><rect x="16" y="46" width="32" height="18" fill="#f2c94c"/><text x="32" y="59" font-size="8" text-anchor="middle" fill="#7a1f1f" font-weight="800">${short}</text></svg>`;
  if(d.f==="bin") return `<svg viewBox="0 0 64 84"><rect x="25" y="4" width="14" height="10" rx="2" fill="#adb5bd"/><path d="M25 14 H39 V22 Q48 27 48 36 V76 Q48 80 44 80 H20 Q16 80 16 76 V36 Q16 27 25 22Z" fill="#6b3d0e"/><rect x="16" y="40" width="32" height="26" fill="${c}"/><text x="32" y="56" font-size="8" text-anchor="middle" fill="${lab}" font-weight="800">${short}</text></svg>`;
  // mini
  return `<svg viewBox="0 0 64 84"><rect x="25" y="14" width="14" height="10" rx="2" fill="#ced4da"/><path d="M25 24 H39 V30 Q46 34 46 42 V76 Q46 80 42 80 H22 Q18 80 18 76 V42 Q18 34 25 30Z" fill="#5a3410"/><rect x="18" y="46" width="28" height="22" fill="${c}"/><text x="32" y="60" font-size="7" text-anchor="middle" fill="${lab}" font-weight="800">${short}</text></svg>`;
}
function thumb(d){
  const src = photos[d.id] || d.photo;
  return src ? `<img src="${src}" alt="${d.n}">` : bottle(d);
}

/* ===== 表示用 ===== */
const yen = n => n==null ? "" : n.toLocaleString("ja-JP")+"円";
function priceLine(d){ return d.p==null ? `<span class="st-ng">要確認</span>` : yen(d.p)+`<small>${d.lv===0?"":"／本"}</small>`; }
function cafBadge(d){
  if(d.alc) return `<span class="badge b-sake">🍶アルコール入り</span>`+(d.cf===0?`<span class="badge b-caf0">ノンカフェイン</span>`:"");
  if(d.cf===0) return `<span class="badge b-caf0">ノンカフェイン</span>`;
  if(typeof d.cf==="number") return `<span class="badge">☕${d.cf}mg</span>`;
  if(d.cfIn) return `<span class="badge">☕カフェイン入り</span>`;
  return "";
}
const lvText = d => d.lv===0 ? `<span class="badge">番外</span>` : `<span class="lv">${"●".repeat(d.lv)}${"○".repeat(5-d.lv)}</span>`;
function bandOf(d){ if(d.p==null) return null; return BAND.find(b=>d.p>=b.min&&d.p<=b.max).k; }
function placeOf(d){ return d.lv===0 ? "rare" : KUBUN[d.k].pk; }

function card(d){
  const k=KUBUN[d.k];
  return `<div class="item" data-id="${d.id}">
    <div class="thumb">${thumb(d)}</div>
    <div class="info">
      <div class="nm">${d.n}</div>
      <div class="mk">${d.m}・${d.v}</div>
      <div class="row">${lvText(d)}<span class="badge ${k.cls}">${k.label}</span>${cafBadge(d)}</div>
      <div class="row">${d.h.map(x=>`<span class="badge">${HERB[x].split("（")[0]}</span>`).join("")}<span class="price">${priceLine(d)}</span></div>
    </div>
    <button class="fav ${favs.has(d.id)?"on":""}" data-fav="${d.id}" aria-label="お気に入り">${favs.has(d.id)?"★":"☆"}</button>
  </div>`;
}

/* ===== 絞り込み ===== */
function filtered(){
  let r = DATA.slice();
  if(S.tab==="fav") r = r.filter(d=>favs.has(d.id));
  if(S.tab==="find"){
    if(S.lv!==null) r=r.filter(d=>d.lv===S.lv);
    if(S.when.size) r=r.filter(d=>[...S.when].every(w=> w==="ne" ? (d.cf===0 && d.w.includes("ne")) : d.w.includes(w)));
    if(S.use.size) r=r.filter(d=>[...S.use].some(u=>d.u.includes(u)));
    if(S.herb.size) r=r.filter(d=>[...S.herb].every(h=>d.h.includes(h)));
    if(S.place.size) r=r.filter(d=>S.place.has(placeOf(d)));
    if(S.band.size) r=r.filter(d=>S.band.has(bandOf(d)));
  }
  const lvKey = d => d.lv===0 ? 6 : d.lv;
  const pk = d => d.p==null ? 1e9 : d.p;
  if(S.sort==="lv") r.sort((a,b)=>lvKey(a)-lvKey(b) || pk(a)-pk(b));
  if(S.sort==="pa") r.sort((a,b)=>pk(a)-pk(b));
  if(S.sort==="pd") r.sort((a,b)=>(b.p??-1)-(a.p??-1));
  if(S.sort==="nm") r.sort((a,b)=>a.n.localeCompare(b.n,"ja"));
  return r;
}

function render(){
  document.getElementById("finder").classList.toggle("hide", S.tab!=="find");
  document.getElementById("resetBtn").classList.toggle("hide", S.tab!=="find");
  const r = filtered();
  document.getElementById("cnt").textContent = (S.tab==="fav"?"お気に入り ":"")+r.length+"件";
  const list = document.getElementById("list");
  if(!r.length){
    list.innerHTML = `<div class="empty">${S.tab==="fav"?"☆をタップするとここに入ります":"条件に合うものがありません。条件を少しゆるめてみてください"}</div>`;
    return;
  }
  if(S.tab==="all" && S.sort==="lv"){
    let html="", cur=null;
    r.forEach(d=>{
      if(d.lv!==cur){ cur=d.lv; const L=LV.find(x=>x.v===cur);
        html+=`<div class="zone"><b>${cur===0?"番外":"Lv"+cur} ${L.t}</b><small>${L.d}</small></div>`; }
      html+=card(d);
    });
    list.innerHTML=html;
  } else list.innerHTML = r.map(card).join("");
}

/* ===== 条件UI ===== */
function chipGroup(el, map, set){
  el.innerHTML = Object.entries(map).map(([k,t])=>`<button class="chip" data-k="${k}">${t}</button>`).join("");
  el.onclick = e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    const k=b.dataset.k; set.has(k)?set.delete(k):set.add(k);
    b.classList.toggle("on", set.has(k)); render();
  };
}
function buildFinder(){
  const lvrow=document.getElementById("lvrow");
  lvrow.innerHTML = LV.map(l=>`<button class="lvbtn" data-v="${l.v}"><span class="n">${l.v===0?"外":l.v}</span>${l.t}</button>`).join("");
  lvrow.onclick=e=>{
    const b=e.target.closest(".lvbtn"); if(!b) return;
    const v=+b.dataset.v; S.lv = (S.lv===v)?null:v;
    [...lvrow.children].forEach(x=>x.classList.toggle("on", +x.dataset.v===S.lv));
    const L=LV.find(x=>x.v===S.lv);
    document.getElementById("lvdesc").textContent = L ? L.d : "レベルを選ぶと候補がしぼれます";
    render();
  };
  chipGroup(document.getElementById("whenChips"), WHEN, S.when);
  chipGroup(document.getElementById("useChips"), USE, S.use);
  chipGroup(document.getElementById("herbChips"), HERB, S.herb);
  chipGroup(document.getElementById("placeChips"), PLACE, S.place);
  chipGroup(document.getElementById("bandChips"), Object.fromEntries(BAND.map(b=>[b.k,b.t])), S.band);
}

/* ===== 詳細シート ===== */
let curId=null;
function openDetail(id){
  const d=DATA.find(x=>x.id===id); if(!d) return; curId=id;
  const k=KUBUN[d.k];
  const place = d.lv===0 && d.k!=="d1" ? k.place+"。取り寄せ・メーカー直販も" : k.place;
  const whenTxt = d.w.filter(w=>w!=="ne"||d.cf===0).map(w=>WHEN[w]).join("・");
  const caf = d.alc ? "なし（アルコール14%入り。運転前は飲めない）" : d.cf===0 ? "なし（ノンカフェイン）" : typeof d.cf==="number" ? d.cf+"mg" : d.cfIn ? "入り（量は要確認）" : "要確認";
  document.getElementById("sheet").innerHTML = `
    <button class="close" id="closeBtn">×</button>
    <div class="hero"><div class="thumb">${thumb(d)}</div>
      <div><h3>${d.n}</h3><div class="mk">${d.m}</div>
      <div class="row">${lvText(d)}<span class="badge ${k.cls}">${k.label}</span></div></div></div>
    <dl class="kv">
      <div><dt>参考価格</dt><dd>${d.p==null?'<span class="st-ng">要確認（店頭で確認）</span>':(d.pt||yen(d.p))}</dd></div>
      <div><dt>買える場所</dt><dd>${place}</dd></div>
      <div><dt>容量・形</dt><dd>${d.v}</dd></div>
      <div><dt>カフェイン</dt><dd>${caf}</dd></div>
      <div><dt>いつ飲む</dt><dd>${whenTxt||"—"}</dd></div>
      <div><dt>用途</dt><dd>${d.u.map(u=>USE[u]).join("・")}</dd></div>
      ${d.h.length?`<div><dt>注目の生薬</dt><dd>${d.h.map(h=>HERB[h]).join("　")}</dd></div>`:""}
      ${d.note?`<div><dt>ひとこと</dt><dd>${d.note}</dd></div>`:""}
      <div><dt>出典</dt><dd>${d.src}</dd></div>
      <div><dt>確認状態</dt><dd>${d.ok?'<span class="st-ok">価格確認済み</span>':'<span class="st-ng">価格は要確認</span>'}（2026年10月調べ）</dd></div>
    </dl>
    <div class="btns">
      <button class="btn pri" id="photoBtn">📷 写真を入れる</button>
      ${photos[d.id]?'<button class="btn" id="photoDel">写真を外す</button>':""}
      <button class="btn" id="favBtn">${favs.has(d.id)?"★ お気に入り済み":"☆ お気に入り"}</button>
    </div>
    <p class="mk" style="margin-top:10px">入れた写真はこの端末のブラウザの中だけに保存され、どこにも送信されません。</p>`;
  document.getElementById("mask").classList.add("show");
}
function closeDetail(){ document.getElementById("mask").classList.remove("show"); curId=null; }

function toggleFav(id){
  favs.has(id)?favs.delete(id):favs.add(id);
  LS.set("ikki_fav",[...favs]); render(); if(curId===id) openDetail(id);
}

/* 写真：縮小してlocalStorageへ */
function addPhoto(file){
  const id=curId; if(!file||!id) return;
  const img=new Image(), rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{
      const max=480, s=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas"); cv.width=img.width*s; cv.height=img.height*s;
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      photos[id]=cv.toDataURL("image/jpeg",0.8); LS.set("ikki_photos",photos); render(); openDetail(id);
    }; img.src=rd.result; };
  rd.readAsDataURL(file);
}

/* ===== イベント ===== */
document.querySelector(".tabs").onclick=e=>{
  const b=e.target.closest("button"); if(!b) return;
  S.tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render(); window.scrollTo(0,0);
};
document.getElementById("list").onclick=e=>{
  const f=e.target.closest("[data-fav]"); if(f){ e.stopPropagation(); toggleFav(f.dataset.fav); return; }
  const it=e.target.closest(".item"); if(it) openDetail(it.dataset.id);
};
document.getElementById("mask").onclick=e=>{
  if(e.target.id==="mask"||e.target.id==="closeBtn") closeDetail();
  if(e.target.id==="favBtn") toggleFav(curId);
  if(e.target.id==="photoBtn") document.getElementById("photoInput").click();
  if(e.target.id==="photoDel"){ delete photos[curId]; LS.set("ikki_photos",photos); render(); openDetail(curId); }
};
document.getElementById("photoInput").onchange=e=>{ addPhoto(e.target.files[0]); e.target.value=""; };
document.getElementById("sort").onchange=e=>{ S.sort=e.target.value; render(); };
document.getElementById("resetBtn").onclick=()=>{
  S.lv=null; ["when","use","herb","place","band"].forEach(k=>S[k].clear());
  document.querySelectorAll("#finder .on").forEach(x=>x.classList.remove("on"));
  document.getElementById("lvdesc").textContent="レベルを選ぶと候補がしぼれます"; render();
};

buildFinder(); render();
</script>
</body>
</html>
